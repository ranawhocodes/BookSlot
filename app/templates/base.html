<!DOCTYPE html>
<html lang="en" class="h-full bg-[#F4F3EC] text-[#181A1D] antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}SlotEngine | Modern Booking & Queues{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#FAF9F5',
                            100: '#F4F3EC',
                            200: '#E8E6DC',
                            300: '#D6D3C4',
                        },
                        turf: {
                            50: '#EBF5EA',
                            100: '#D7ECD5',
                            400: '#A3C962',
                            500: '#5E9E47',
                            600: '#4B8338',
                            700: '#39662A',
                            900: '#1D3515',
                        },
                        obsidian: '#181A1D',
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            900: '#064e3b',
                            950: '#022c22',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- HTMX 2.0.4 CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
        }

        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body class="h-full flex flex-col bg-[#F4F3EC] text-[#181A1D]"
      hx-headers='{"X-CSRFToken": "{{ csrf_token() }}"}'>
    <!-- Flash Notifications -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-4 left-4 right-4 z-50 max-w-md mx-auto space-y-2">
        {% for category, message in messages %}
        <div
            class="px-4 py-3.5 rounded-2xl text-xs font-bold shadow-xl flex items-center justify-between {% if category == 'error' %}bg-rose-600 text-white{% elif category == 'success' %}bg-[#181A1D] text-white border border-[#A3C962]/40{% else %}bg-white text-[#181A1D] border border-stone-200{% endif %}">
            <span class="flex items-center gap-2">
                <span
                    class="w-2 h-2 rounded-full {% if category == 'error' %}bg-white{% else %}bg-[#A3C962]{% endif %}"></span>
                {{ message }}
            </span>
            <button type="button" onclick="this.parentElement.remove()" title="Dismiss"
                aria-label="Dismiss notification" class="ml-3 opacity-70 hover:opacity-100 text-base">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <main class="flex-1 flex flex-col min-h-0">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Ensure every standard POST form includes csrf_token even after dynamic DOM updates
        function injectCsrfTokens() {
            const tokenMeta = document.querySelector('meta[name="csrf-token"]');
            if (!tokenMeta) return;
            const token = tokenMeta.getAttribute('content');
            document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(form => {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    input.value = token;
                    form.prepend(input);
                }
            });
        }
        document.addEventListener('DOMContentLoaded', injectCsrfTokens);
        document.addEventListener('htmx:afterSwap', injectCsrfTokens);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
